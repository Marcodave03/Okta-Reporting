services:
  app:
    build: .
    container_name: okta-iga-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Postgres lokal di container; hapus baris ini untuk memakai DATABASE_URL dari .env (mis. Clever Cloud)
      DATABASE_URL: postgresql://iga:iga@postgres:5432/okta_iga
      # SMTP diambil dari .env apa adanya; hanya SMTP_HOST=localhost (Mailpit untuk dev) diarahkan ke container mailpit
      SMTP_LOCALHOST_ALIAS: mailpit
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  postgres:
    image: postgres:16
    container_name: okta-iga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iga
      POSTGRES_PASSWORD: iga
      POSTGRES_DB: okta_iga
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "iga", "-d", "okta_iga"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # SMTP lokal untuk testing email (UI: http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    container_name: okta-iga-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pg-data:
